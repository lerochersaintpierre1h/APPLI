<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Le Rocher Saint Pierre - 1H</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: #f5f5f7; }
    #sidebar { width: 220px; background: #2c3e50; color: white; padding: 20px; }
    #sidebar h2 { font-size: 16px; margin-bottom: 30px; }
    .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: transparent; color: white; border: none; text-align: left; cursor: pointer; border-radius: 6px; font-size: 14px; }
    .nav-btn:hover, .nav-btn.active { background: #34495e; font-weight: bold; }
    #content { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>VALLOIRE 1H</h2>
    <button class="nav-btn active" onclick="showTab('planning')">📅 Planning</button>
    <button class="nav-btn" onclick="showTab('resas')">📋 Réservations</button>
    <button class="nav-btn" onclick="showTab('tarifs')">💰 Tarifs & Saisons</button>
    <button class="nav-btn" onclick="showTab('compta')">📊 Comptabilité</button>
  </div>

  <div id="content">
    <div class="card">
      <h3>Fichier actif : RESA VALLOIRE 2027.xlsx</h3>
      <input type="file" id="excelFile" accept=".xlsx" />
    </div>

    <div id="tab-content" class="card">
      <h4>Sélectionnez votre fichier Excel pour charger les données.</h4>
    </div>
  </div>

  <script>
    function showTab(name) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-content').innerHTML = `<h4>Onglet ${name.toUpperCase()}</h4><p>Données synchronisées avec l'Excel.</p>`;
    }
  </script>
</body>
</html>
